# Manual TestFlight upload for Ask AI Buddha.
# The App Store Connect app does not exist yet, so this workflow is manual only.
# Review steps are in store-assets/APP_STORE.md.
name: iOS TestFlight

on:
  workflow_dispatch:
  # One-shot: a push that touches the sentinel starts this manual workflow
  # when the caller cannot send workflow_dispatch. Remove it after the run starts.
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-testflight.trigger

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write the App Store Connect API key
        run: |
          python3 - << 'PY'
          import base64, os, pathlib, re, subprocess
          key_id = re.sub(r"\s+", "", os.environ["ASC_KEY_ID"])
          issuer = re.sub(r"\s+", "", os.environ["ASC_ISSUER_ID"])
          team = re.sub(r"\s+", "", os.environ["APPLE_TEAM_ID"])
          raw = os.environ["ASC_PRIVATE_KEY"].strip().strip('"').strip("'").lstrip("\ufeff")
          if not key_id or not issuer or not team or not raw:
              raise SystemExit("ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY, and APPLE_TEAM_ID are required.")
          if not re.fullmatch(r"[A-Za-z0-9]{10}", key_id):
              raise SystemExit(f"ASC_KEY_ID should be 10 letters or digits, got length {len(key_id)}.")
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", issuer):
              raise SystemExit(f"ASC_ISSUER_ID should be a UUID, got length {len(issuer)}.")
          if not re.fullmatch(r"[A-Z0-9]{10}", team):
              raise SystemExit(f"APPLE_TEAM_ID should be 10 letters or digits, got length {len(team)}.")
          if "BEGIN" not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode()
              except Exception as error:
                  raise SystemExit(f"ASC_PRIVATE_KEY is neither a PEM nor base64 PEM ({error}).")
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n")
          if not raw.endswith("\n"):
              raw += "\n"
          if "BEGIN PRIVATE KEY" not in raw and "BEGIN EC PRIVATE KEY" not in raw:
              raise SystemExit("ASC_PRIVATE_KEY PEM header is missing. Expected BEGIN PRIVATE KEY.")
          env_path = os.environ.get("GITHUB_ENV")
          if env_path:
              with open(env_path, "a", encoding="utf-8") as handle:
                  handle.write(f"ASC_KEY_ID={key_id}\nASC_ISSUER_ID={issuer}\nAPPLE_TEAM_ID={team}\n")
          written = None
          for folder in (pathlib.Path.home() / "private_keys", pathlib.Path("private_keys"), pathlib.Path.home() / ".private_keys", pathlib.Path.home() / ".appstoreconnect" / "private_keys"):
              folder.mkdir(mode=0o700, parents=True, exist_ok=True)
              path = folder / f"AuthKey_{key_id}.p8"
              path.write_text(raw)
              path.chmod(0o600)
              written = path
          check = subprocess.run(["openssl", "pkey", "-in", str(written), "-noout"], capture_output=True, text=True)
          if check.returncode != 0:
              raise SystemExit("ASC_PRIVATE_KEY is not a readable private key. Check that the .p8 contents were pasted unchanged.")
          print(f"API key written, id length {len(key_id)}, team length {len(team)}, {raw.count(chr(10))} lines")
          PY

      - name: Sync the iOS shell
        run: npx cap sync ios

      - name: Set the build number
        run: |
          python3 - << 'PY'
          import os, pathlib, re
          path = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()
          build = os.environ.get("GITHUB_RUN_NUMBER", "1")
          text = re.sub(r"CURRENT_PROJECT_VERSION = [^;]+;", f"CURRENT_PROJECT_VERSION = {build};", text)
          text = re.sub(r"MARKETING_VERSION = [^;]+;", "MARKETING_VERSION = 1.0.0;", text)
          path.write_text(text)
          print(f"Marketing version 1.0.0, build {build}")
          PY

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # macos-15 still defaults to Xcode 16.4 (iOS 18.5 SDK). App Store Connect
          # rejects that SDK and requires the iOS 26 SDK from Xcode 26 or later.
          XCODE_APP="$(python3 - << 'PY'
          import pathlib, re, sys
          apps = []
          root = pathlib.Path("/Applications")
          for path in root.glob("Xcode_26*.app"):
              name = path.name
              lowered = name.lower()
              if "beta" in lowered or "release_candidate" in lowered or path.is_symlink():
                  continue
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", name)
              if not match:
                  continue
              apps.append((tuple(int(part) for part in match.group(1).split(".")), path))
          if not apps:
              print("Xcode 26 is not installed. Found:", file=sys.stderr)
              for path in sorted(root.glob("Xcode*.app")):
                  print(path, file=sys.stderr)
              raise SystemExit(1)
          apps.sort()
          print(apps[-1][1])
          PY
          )"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos' || true

      - name: Archive and upload with automatic signing
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ ! -f "$KEY_PATH" ]; then
            echo "App Store Connect key file is missing at the expected AuthKey path"
            exit 1
          fi
          echo "Checking the App Store Connect API key with altool"
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer \
            xcrun altool --list-providers --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/ios-export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          # Automatic signing during archive asks for an iOS App Development profile.
          # This team has no registered devices, so that profile cannot be created,
          # and an Apple Distribution identity conflicts with automatic development signing.
          # The archive is unsigned. Export creates the App Store profile with the API key.
          XCODE_ARCHIVE=(
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            IPHONEOS_DEPLOYMENT_TARGET=15.0
          )
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild "${XCODE_ARCHIVE[@]}" -workspace ios/App/App.xcworkspace -scheme App \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          else
            xcodebuild "${XCODE_ARCHIVE[@]}" -project ios/App/App.xcodeproj -scheme App \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          fi
          APP_PLIST="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          SDK_NAME=""
          if [ -f "$APP_PLIST" ]; then
            SDK_NAME="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP_PLIST" 2>/dev/null || true)"
          fi
          echo "Archived with SDK ${SDK_NAME:-unknown}"
          case "$SDK_NAME" in
            ""|iphoneos2[6-9]*|iphoneos[3-9][0-9]*) ;;
            *)
              echo "Apple requires the iOS 26 SDK or later. This archive used $SDK_NAME"
              exit 1
              ;;
          esac
          verify_app_icon() {
            local APP="$1"
            echo "Checking app icon in $APP"
            ls -la "$APP/Assets.car" "$APP"/AppIcon*.png || true
            echo "CFBundleIcons:"
            if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP/Info.plist"; then
              echo "CFBundleIcons is missing from the built Info.plist"
              plutil -p "$APP/Info.plist" || true
              exit 1
            fi
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
            if [ -x /usr/bin/assetutil ]; then
              /usr/bin/assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets-car.json"
            else
              xcrun assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets-car.json"
            fi
            python3 - "$RUNNER_TEMP/assets-car.json" << 'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if isinstance(data, dict):
              data = data.get("Assets") or data.get("assets") or [data]
          icons = []
          for item in data:
              if not isinstance(item, dict):
                  continue
              kind = str(item.get("AssetType", ""))
              name = str(item.get("Name", ""))
              if "Icon" in kind or name == "AppIcon":
                  icons.append(item)
          print(f"Assets.car icon entries: {len(icons)}")
          large = []
          for item in icons:
              width = int(item.get("PixelWidth") or 0)
              height = int(item.get("PixelHeight") or 0)
              if width or height:
                  print(
                      f"  {item.get('Name')} {item.get('Idiom')} "
                      f"{width}x{height} scale={item.get('Scale')} "
                      f"opaque={item.get('Opaque')} type={item.get('AssetType')}"
                  )
              if width >= 180 and height >= 180 and item.get("Opaque") is not False:
                  large.append(item)
          if not large:
              raise SystemExit("Assets.car has no opaque AppIcon rendition at 180px or larger")
          PY
          }
          verify_app_icon "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA="$(find "$RUNNER_TEMP/ios-export" -name '*.ipa' -print -quit)"
          echo "Uploading $IPA"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          verify_app_icon "$RUNNER_TEMP/ipa-check/Payload/App.app"
          # Xcode 26's xcrun iTMSTransporter is only a stub ("now part of Transporter").
          # Xcode 16.4's altool already authenticated this API key and reached Apple's
          # upload validator. The IPA itself was built with the iOS 26 SDK above.
          if [ -x /Applications/Transporter.app/Contents/itms/bin/iTMSTransporter ]; then
            /Applications/Transporter.app/Contents/itms/bin/iTMSTransporter \
              -m upload -assetFile "$IPA" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"
          else
            DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer \
              xcrun altool --upload-app --file "$IPA" --type ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          fi
